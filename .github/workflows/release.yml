name: Release

# 自动版本迭代 + 自动打 tag + 自动镜像构建（GHCR）
#
# - 推送 main → 读取最新 vX.Y.Z tag，patch+1，创建 tag，构建镜像推送 GHCR
# - 手动触发（workflow_dispatch）可选 patch / minor / major
# - tag 以 GITHUB_TOKEN 推送，不触发本工作流（无循环）；tag 为版本唯一来源，无 VERSION 文件

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增类型（默认 patch）
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write   # 创建/推送 tag
  packages: write    # 推送镜像到 GHCR

# 串行执行：连续 push main 会触发多个 run，并行时各自 fetch tags 都算出
# 同一个版本号 → 后推的 tag 被拒（already exists）。排队后，后到的 run
# 能看到先到的刚推的 tag，正确递增版本
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史与 tag

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          bump="${{ github.event.inputs.bump || 'patch' }}"
          if [ -z "$latest" ]; then
            next="v0.1.0"
            skip=false
          else
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$bump" in
              major) major=$((major+1)); minor=0; patch=0;;
              minor) minor=$((minor+1)); patch=0;;
              *)     patch=$((patch+1));;
            esac
            next="v${major}.${minor}.${patch}"
            # HEAD 已被最新 tag 标记 → 跳过（防重复）
            if [ "$(git rev-parse "${latest}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
              skip=true
              next="$latest"
            else
              skip=false
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "version_num=${next#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::Next version: $next (skip=$skip, bump=$bump)"

      - name: Install dependencies
        if: steps.ver.outputs.skip != 'true'
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Test
        if: steps.ver.outputs.skip != 'true'
        run: |
          ruff check app tests
          pytest -q

      - name: Create & push tag
        if: steps.ver.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.version }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "${{ steps.ver.outputs.version }}"

      - name: Compute image name (lowercase)
        if: steps.ver.outputs.skip != 'true'
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.ver.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.ver.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.ver.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version_num }}
            ghcr.io/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
