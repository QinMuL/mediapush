services:
  mediapush:
    image: ghcr.io/qinmul/mediapush:latest   # CI 自动发布镜像；docker compose pull 拉取
    build: .                                  # 本地开发：docker compose up -d --build
    container_name: mediapush
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai   # 容器时区，日志/时间相关一致用中国时区
    # host 网络：代理只监听 127.0.0.1，host 模式让容器直连宿主机 loopback
    network_mode: host
    # Docker 日志轮转：stdout 走 json-file 驱动，限制单文件 10MB、保留 3 份（共 ≤30MB）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
    # 健康检查：Bot 每 30s 写 /tmp/.heartbeat，此处检查文件是否在 120s 内更新过。
    # 连续 3 次失败（~2min）标记 unhealthy，配合 restart 策略自动恢复卡死场景。
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,time; exit(0 if time.time()-os.path.getmtime('/tmp/.heartbeat')<120 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
