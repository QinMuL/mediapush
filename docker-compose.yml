services:
  mediapush:
    image: ghcr.io/qinmul/mediapush:latest   # CI 自动发布镜像；docker compose pull 拉取
    build: .                                  # 本地开发：docker compose up -d --build
    container_name: mediapush
    restart: unless-stopped
    env_file:
      - .env
    # host 网络：代理只监听 127.0.0.1，host 模式让容器直连宿主机 loopback
    network_mode: host
    volumes:
      - ./data:/app/data
